name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (simulator)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        # Do NOT xcode-select a specific version: the runner image's simulator
        # runtimes only match its default Xcode. (Same lesson as ioniq's
        # ios-build.yml — forcing another Xcode breaks simulator availability.)
        run: xcodebuild -version

      - name: Build app (simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Kryptos.xcodeproj \
            -scheme Kryptos \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build > /tmp/build.log 2>&1 || {
              echo "===== BUILD FAILED ====="
              grep -nE "error:|warning:" /tmp/build.log | head -80
              echo "===== LAST 30 LINES ====="
              tail -30 /tmp/build.log
              exit 1
            }

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Kryptos.xcodeproj \
            -scheme Kryptos \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -only-testing:KryptosTests > /tmp/test.log 2>&1 || {
              echo "===== TESTS FAILED ====="
              grep -nE "error:|failed|Test Case.*failed" /tmp/test.log | head -60
              echo "===== LAST 30 LINES ====="
              tail -30 /tmp/test.log
              exit 1
            }

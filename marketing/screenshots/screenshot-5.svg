<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2400" viewBox="0 0 1080 2400" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset="1" stop-color="#0E1424"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#0056D2" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0056D2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#0056D2"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1424"/>
      <stop offset="1" stop-color="#1a2238"/>
    </linearGradient>
    <linearGradient id="proCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0056D2" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#0056D2" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="2400" fill="url(#bg)"/>
  <rect width="1080" height="2400" fill="url(#glow)"/>

  <text x="540" y="220" font-size="86" font-weight="800" fill="#E6EAF5" text-anchor="middle" letter-spacing="-2">Pay once.</text>
  <text x="540" y="320" font-size="86" font-weight="800" fill="url(#grad)" text-anchor="middle" letter-spacing="-2">Yours forever.</text>
  <text x="540" y="400" font-size="36" font-weight="500" fill="#9AA3BA" text-anchor="middle">No subscriptions. No recurring fees.</text>

  <g transform="translate(180,520)">
    <rect width="720" height="1480" rx="80" fill="#1a2238" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    <rect x="14" y="14" width="692" height="1452" rx="68" fill="url(#screen)"/>
    <rect x="295" y="36" width="130" height="32" rx="16" fill="#06091a"/>

    <text x="60" y="120" font-size="22" font-weight="600" fill="#E6EAF5">9:41</text>
    <text x="660" y="120" font-size="22" fill="#E6EAF5" text-anchor="end">100%</text>

    <text x="360" y="260" font-size="40" font-weight="800" fill="#E6EAF5" text-anchor="middle" letter-spacing="-1">Unlock Kryptos Pro</text>
    <text x="360" y="304" font-size="22" fill="#9AA3BA" text-anchor="middle">One-time purchase. That's it.</text>

    <!-- Free card -->
    <g transform="translate(60,360)">
      <rect width="600" height="240" rx="24" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)"/>
      <text x="30" y="58" font-size="24" font-weight="700" fill="#E6EAF5">Free</text>
      <text x="30" y="120" font-size="56" font-weight="800" fill="#E6EAF5" letter-spacing="-2">$0</text>
      <text x="160" y="118" font-size="20" fill="#9AA3BA">up to 10 entries</text>
      <text x="30" y="170" font-size="20" fill="#E6EAF5">✓ Full features</text>
      <text x="30" y="206" font-size="20" fill="#E6EAF5">✓ Encrypted Drive backup</text>
    </g>

    <!-- Pro card -->
    <g transform="translate(60,630)">
      <rect width="600" height="500" rx="24" fill="url(#proCard)" stroke="rgba(91,141,239,0.5)" stroke-width="2"/>

      <!-- Pro tag -->
      <g transform="translate(490,30)">
        <rect width="80" height="32" rx="16" fill="#0056D2"/>
        <text x="40" y="22" font-size="14" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">PRO</text>
      </g>

      <text x="30" y="58" font-size="24" font-weight="700" fill="#E6EAF5">Kryptos Pro</text>
      <text x="30" y="130" font-size="72" font-weight="800" fill="#E6EAF5" letter-spacing="-3">$1.99</text>
      <text x="220" y="128" font-size="20" fill="#9AA3BA">one-time</text>

      <line x1="30" y1="170" x2="570" y2="170" stroke="rgba(255,255,255,0.1)"/>

      <g font-size="22" fill="#E6EAF5">
        <text x="30" y="220"><tspan fill="#5BE49B">✓</tspan>  <tspan font-weight="700">Unlimited</tspan> entries</text>
        <text x="30" y="266"><tspan fill="#5BE49B">✓</tspan>  Visible "KryptosBackups" folder</text>
        <text x="30" y="312"><tspan fill="#5BE49B">✓</tspan>  Easier restore &amp; portability</text>
        <text x="30" y="358"><tspan fill="#5BE49B">✓</tspan>  Priority support</text>
        <text x="30" y="404"><tspan fill="#5BE49B">✓</tspan>  All future Pro features</text>
      </g>

      <!-- CTA -->
      <g transform="translate(30,430)">
        <rect width="540" height="56" rx="28" fill="#0056D2"/>
        <text x="270" y="36" font-size="20" font-weight="700" fill="white" text-anchor="middle">Unlock Pro — $1.99</text>
      </g>
    </g>

    <!-- Trust line -->
    <g transform="translate(60,1170)">
      <text x="300" y="40" font-size="22" font-weight="700" fill="#E6EAF5" text-anchor="middle">No subscriptions · No recurring fees</text>
      <text x="300" y="76" font-size="18" fill="#9AA3BA" text-anchor="middle">Restore your purchase anytime via Google Play</text>
    </g>

    <!-- Footer badges -->
    <g transform="translate(60,1290)">
      <g>
        <rect width="180" height="80" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="90" y="36" font-size="22" fill="#E6EAF5" text-anchor="middle">🔐</text>
        <text x="90" y="64" font-size="14" font-weight="600" fill="#9AA3BA" text-anchor="middle">AES-256</text>
      </g>
      <g transform="translate(210,0)">
        <rect width="180" height="80" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="90" y="36" font-size="22" text-anchor="middle">👆</text>
        <text x="90" y="64" font-size="14" font-weight="600" fill="#9AA3BA" text-anchor="middle">Biometric</text>
      </g>
      <g transform="translate(420,0)">
        <rect width="180" height="80" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
        <text x="90" y="36" font-size="22" text-anchor="middle">📶</text>
        <text x="90" y="64" font-size="14" font-weight="600" fill="#9AA3BA" text-anchor="middle">NFC + OCR</text>
      </g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2400" viewBox="0 0 1080 2400" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset="1" stop-color="#0E1424"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#0056D2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0056D2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#0056D2"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1424"/>
      <stop offset="1" stop-color="#1a2238"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="2400" fill="url(#bg)"/>
  <rect width="1080" height="2400" fill="url(#glow)"/>

  <text x="540" y="220" font-size="86" font-weight="800" fill="#E6EAF5" text-anchor="middle" letter-spacing="-2">Zero-knowledge</text>
  <text x="540" y="320" font-size="86" font-weight="800" fill="url(#grad)" text-anchor="middle" letter-spacing="-2">by design.</text>
  <text x="540" y="400" font-size="36" font-weight="500" fill="#9AA3BA" text-anchor="middle">We don't have your key. We can't read your vault.</text>

  <g transform="translate(180,520)">
    <rect width="720" height="1480" rx="80" fill="#1a2238" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    <rect x="14" y="14" width="692" height="1452" rx="68" fill="url(#screen)"/>
    <rect x="295" y="36" width="130" height="32" rx="16" fill="#06091a"/>

    <text x="60" y="120" font-size="22" font-weight="600" fill="#E6EAF5">9:41</text>
    <text x="660" y="120" font-size="22" fill="#E6EAF5" text-anchor="end">100%</text>

    <!-- Big lock badge -->
    <g transform="translate(260,260)">
      <circle cx="100" cy="100" r="100" fill="rgba(91,141,239,0.12)" stroke="rgba(91,141,239,0.35)" stroke-width="2"/>
      <circle cx="100" cy="100" r="70" fill="#0056D2"/>
      <rect x="74" y="92" width="52" height="44" rx="6" fill="white"/>
      <path d="M82,92 v-12 a18,18 0 0 1 36,0 v12" fill="none" stroke="white" stroke-width="6"/>
      <circle cx="100" cy="114" r="4" fill="#0056D2"/>
    </g>

    <text x="360" y="540" font-size="38" font-weight="800" fill="#E6EAF5" text-anchor="middle">Vault locked</text>
    <text x="360" y="588" font-size="22" fill="#9AA3BA" text-anchor="middle">Tap to unlock with biometric</text>

    <!-- Security stats -->
    <g transform="translate(60,680)">
      <rect width="600" height="120" rx="20" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <g transform="translate(40,30)">
        <circle cx="30" cy="30" r="30" fill="rgba(91,141,239,0.18)"/>
        <text x="30" y="40" font-size="28" fill="#5B8DEF" text-anchor="middle">🔐</text>
      </g>
      <text x="140" y="62" font-size="26" font-weight="700" fill="#E6EAF5">AES-256 · SQLCipher</text>
      <text x="140" y="94" font-size="20" fill="#9AA3BA">Hardware-backed Keystore</text>
    </g>

    <g transform="translate(60,820)">
      <rect width="600" height="120" rx="20" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <g transform="translate(40,30)">
        <circle cx="30" cy="30" r="30" fill="rgba(91,141,239,0.18)"/>
        <text x="30" y="40" font-size="28" text-anchor="middle">👆</text>
      </g>
      <text x="140" y="62" font-size="26" font-weight="700" fill="#E6EAF5">Biometric unlock</text>
      <text x="140" y="94" font-size="20" fill="#9AA3BA">Fingerprint or Face Unlock</text>
    </g>

    <g transform="translate(60,960)">
      <rect width="600" height="120" rx="20" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <g transform="translate(40,30)">
        <circle cx="30" cy="30" r="30" fill="rgba(91,141,239,0.18)"/>
        <text x="30" y="40" font-size="28" text-anchor="middle">☁</text>
      </g>
      <text x="140" y="62" font-size="26" font-weight="700" fill="#E6EAF5">Encrypted Drive backup</text>
      <text x="140" y="94" font-size="20" fill="#9AA3BA">Google can't read it. Only you.</text>
    </g>

    <g transform="translate(60,1100)">
      <rect width="600" height="120" rx="20" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <g transform="translate(40,30)">
        <circle cx="30" cy="30" r="30" fill="rgba(91,141,239,0.18)"/>
        <text x="30" y="40" font-size="28" text-anchor="middle">✓</text>
      </g>
      <text x="140" y="62" font-size="26" font-weight="700" fill="#E6EAF5">No analytics on contents</text>
      <text x="140" y="94" font-size="20" fill="#9AA3BA">No ads. No tracking. Ever.</text>
    </g>

    <!-- Unlock button -->
    <g transform="translate(60,1290)">
      <rect width="600" height="100" rx="50" fill="#0056D2"/>
      <text x="300" y="64" font-size="26" font-weight="700" fill="white" text-anchor="middle">Unlock with Biometric</text>
    </g>
  </g>
</svg>
